# ═══════════════════════════════════════════════════════════════════════════
# RESUME ROASTER - Application Configuration
# ═══════════════════════════════════════════════════════════════════════════

# Server
server.port=8080

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# H2 In-Memory Database (no installation needed)
spring.datasource.url=jdbc:h2:mem:resume_roaster
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:YOUR_GROQ_API_KEY_HERE}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant

# File Storage
app.upload.dir=${java.io.tmpdir}/resume-roaster-uploads

# Logging
logging.level.com.resumeroaster=DEBUG
logging.level.org.springframework.web=INFO
